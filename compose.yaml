services:
# подключисья к postgres и добавить роль prom_exp с паролем prom_pass и выдать ему роли, можно просто подключится к sql и вставить вот это
# -- DROP ROLE prom_exp;

# CREATE ROLE prom_exp WITH 
# 	NOSUPERUSER
# 	NOCREATEDB
# 	NOCREATEROLE
# 	NOINHERIT
# 	LOGIN
# 	REPLICATION
# 	NOBYPASSRLS
# 	CONNECTION LIMIT -1;

# -- Permissions

# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA sales GRANT SELECT ON TABLES TO prom_exp;
# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA pricing GRANT SELECT ON TABLES TO prom_exp;
# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA auth GRANT SELECT ON TABLES TO prom_exp;
# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA inventory GRANT SELECT ON TABLES TO prom_exp;
# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA crm GRANT SELECT ON TABLES TO prom_exp;
# ALTER DEFAULT PRIVILEGES FOR ROLE pg IN SCHEMA "catalog" GRANT SELECT ON TABLES TO prom_exp;
  db:
    image: postgres:16
    container_name: pg_db
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
    command: ["postgres",
      "-c", "maintenance_work_mem=128MB",
      "-c", "max_connections=200"
    ]
    ports:
      - "5432:5432"
    volumes:
      - ./pg/pgdata:/var/lib/postgresql/data

  pg_repl:
    image: postgres:16
    container_name: pg_repl
    environment:
      POSTGRES_USER: repl_user
      POSTGRES_PASSWORD: repl_pass
    command: ["postgres",
      "-c", "hot_standby=on",
      "-c", "max_wal_senders=5",
      "-c", "wal_level=replica"
    ]
    ports:
      - "5433:5432"
    volumes:
      - ./pg/pgdata_repl:/var/lib/postgresql/data
    depends_on:
      - db

  pg_dumper:
    image: postgres:16
    container_name: pg_dumper
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
    depends_on:
      - db
    volumes:
      - ./pg/dumps:/dumps
    ports:
      - "5434:5432"

#  включить репликацию монго
#  файл key/mongokey создавать самому, поэтому сначала комментируем строку с командой
#  потом запускаем контейнер и пишем команды подряд:
#  openssl rand -base64 741 > /key/mongokey
#  chmod 400 /key/mongokey
#  chown mongodb:mongodb /key/mongokey
#  выходи из контейнера
#  потом раскоментируем строку с командой, перезапускаем докер
#  подключаемся черзе компас или docker compose exec mongo mongosh и выполняем(выделять полностью без #):
#   rs.initiate(
#   {  
#   _id : "rs0",
#   members: [
# 	  { _id: 0, host: "mongo:27017"},
#  		{ _id: 1, host: "mongo2:27017"},
#  	 	{ _id: 2, host: "mongo3:27017"}
#   	]
#     }
#   )
  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports: [ "27017:27017" ]
    command: ["--replSet", "rs0", "--keyFile", "/key/mongokey", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - ./mongo/mongo_data:/data/db
      - ./mongo/mongo/keystore/mongokey:/key/mongokey:ro
      - ./mongo/mongo/init:/init

  mongo-express:
    image: mongo-express:1.0.2-20
    restart: unless-stopped
    ports: [ "8081:8081" ]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://root:pass@mongo:27017/
    depends_on: [ mongo ]

  mongo_exporter:
    image: percona/mongodb_exporter:0.47.2
    environment:
      - MONGODB_URI=mongodb://mongo_expr:mongo_expr@mongo:27017/admin?authSource=admin&directConnection=true
    ports:
      - "9216:9216"
    command:
      - '--collect-all'
    depends_on:
      - mongo

  mongo_exporter_2:
    image: percona/mongodb_exporter:0.47.2
    environment:
      - MONGODB_URI=mongodb://mongo_expr:mongo_expr@mongo2:27017/admin?authSource=admin&directConnection=true
    ports:
      - "9217:9216"
    command:
      - '--collect-all'
    depends_on:
      - mongo2

  mongo_exporter_3:
    image: percona/mongodb_exporter:0.47.2
    environment:
      - MONGODB_URI=mongodb://mongo_expr:mongo_expr@mongo3:27017/admin?authSource=admin&directConnection=true
    ports:
      - "9218:9216"
    command:
      - '--collect-all'
    depends_on:
      - mongo3

  mongo2:
    image: mongo:7
    container_name: mongo2
    command: ["--replSet", "rs0", "--keyFile", "/key/mongokey", "--bind_ip_all"]
    volumes:
      - ./mongo/mongo2_data:/data/db
      - ./mongo/mongo/keystore/mongokey:/key/mongokey:ro
    ports:
      - "27018:27017"
      - "27020:27020"

  mongo3:
    image: mongo:7
    container_name: mongo3
    command: ["--replSet", "rs0", "--keyFile", "/key/mongokey", "--bind_ip_all"]
    volumes:
      - ./mongo/mongo3_data:/data/db
      - ./mongo/mongo/keystore/mongokey:/key/mongokey:ro
    ports:
      - "27019:27017"
      - "27021:27021"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_URI=pg_db:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=prom_exp
      - DATA_SOURCE_PASS=prom_pass
    restart: always
    depends_on:
      - db
    ports:
      - "9187:9187"
  postgres-exporter_2:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      - DATA_SOURCE_URI=pg_repl:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=prom_exp
      - DATA_SOURCE_PASS=prom_pass
    restart: always
    depends_on:
      - db
    ports:
      - "9188:9187"

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prom/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prom/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:10.4.2
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    restart: always
    depends_on:
      - prometheus

  redis:
    image: redis
    volumes:
      - ./redis_data:/redis_data
    ports: 
      - "6379:6379"

  neo4j:
    image: neo4j:enterprise
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_server_metrics_prometheus_enabled=true
      - NEO4J_server_metrics_prometheus_endpoint=0.0.0.0:20048
    ports:
      - "7474:7474"
      - "20048:20048"
      - "7687:7687"
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./jmx_exporter:/var/lib/neo4j/jmx_exporter
